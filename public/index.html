<script>
  // Set the theme before anything draws, so there's no flash of the wrong colours.
  (function () { var c = null; try { c = localStorage.getItem('dt-theme'); } catch (e) {}
    var dark = c === 'dark' || (c !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    if (dark) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#11171E'); })();
</script>
